name: Build Multi-Platform Binaries (.EXE & .DMG) & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS EXECUTABLE (.EXE)
  # =========================================================================
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd App
          python -m pip install --upgrade pip
          pip install -r requirements_lean.txt pywebview pyinstaller

      - name: Reconstruct ONNX Models
        run: |
          cd App
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11l'); print('11L Reconstructed:', e.active_model_type)"
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11n'); print('11N Reconstructed:', e.active_model_type)"

      - name: Build Executable with PyInstaller
        run: |
          cd App
          pyinstaller --noconfirm --onedir --windowed --name "Spoonbill_AI_Studio" --add-data "static;static" --add-data "models;models" desktop_app.py

      - name: Package Windows ZIP (.exe bundle)
        run: |
          mkdir release_dist
          Compress-Archive -Path "App/dist/Spoonbill_AI_Studio/*" -DestinationPath "release_dist/Spoonbill_AI_Studio_Windows_x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spoonbill_AI_Studio_Windows_x64
          path: release_dist/Spoonbill_AI_Studio_Windows_x64.zip

  # =========================================================================
  # 2. BUILD macOS INTEL (.DMG)
  # =========================================================================
  build-macos-intel:
    name: Build macOS Intel (.dmg)
    runs-on: macos-15-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd App
          python -m pip install --upgrade pip
          pip install -r requirements_lean.txt pywebview pyinstaller

      - name: Reconstruct ONNX Models
        run: |
          cd App
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11l'); print('11L Reconstructed:', e.active_model_type)"
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11n'); print('11N Reconstructed:', e.active_model_type)"

      - name: Build macOS App Bundle with PyInstaller
        run: |
          cd App
          pyinstaller --noconfirm --windowed --name "Spoonbill_AI_Studio" --add-data "static:static" --add-data "models:models" desktop_app.py

      - name: Create macOS Intel .DMG Installer
        run: |
          mkdir -p release_dist
          mkdir -p dmg_tmp
          cp -r App/dist/Spoonbill_AI_Studio.app dmg_tmp/
          ln -s /Applications dmg_tmp/Applications
          hdiutil create -volname "Spoonbill AI Studio" -srcfolder dmg_tmp -ov -format UDZO "release_dist/Spoonbill_AI_Studio_macOS_Intel_x64.dmg"

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spoonbill_AI_Studio_macOS_Intel_x64
          path: release_dist/Spoonbill_AI_Studio_macOS_Intel_x64.dmg

  # =========================================================================
  # 3. BUILD macOS APPLE SILICON ARM64 (.DMG)
  # =========================================================================
  build-macos-arm64:
    name: Build macOS Apple Silicon ARM64 (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd App
          python -m pip install --upgrade pip
          pip install -r requirements_lean.txt pywebview pyinstaller

      - name: Reconstruct ONNX Models
        run: |
          cd App
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11l'); print('11L Reconstructed:', e.active_model_type)"
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11n'); print('11N Reconstructed:', e.active_model_type)"

      - name: Build macOS ARM64 App Bundle
        run: |
          cd App
          pyinstaller --noconfirm --windowed --name "Spoonbill_AI_Studio" --add-data "static:static" --add-data "models:models" desktop_app.py

      - name: Create macOS Apple Silicon .DMG Installer
        run: |
          mkdir -p release_dist
          mkdir -p dmg_tmp
          cp -r App/dist/Spoonbill_AI_Studio.app dmg_tmp/
          ln -s /Applications dmg_tmp/Applications
          hdiutil create -volname "Spoonbill AI Studio" -srcfolder dmg_tmp -ov -format UDZO "release_dist/Spoonbill_AI_Studio_macOS_AppleSilicon_ARM64.dmg"

      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spoonbill_AI_Studio_macOS_AppleSilicon_ARM64
          path: release_dist/Spoonbill_AI_Studio_macOS_AppleSilicon_ARM64.dmg

  # =========================================================================
  # 4. PUBLISH ALL NATIVE BINARIES (.EXE & .DMG) TO GITHUB RELEASES
  # =========================================================================
  publish-github-release:
    name: Publish .EXE & .DMG Releases to GitHub
    needs: [build-windows, build-macos-intel, build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: Spoonbill_AI_Studio_Windows_x64
          path: all_releases

      - name: Download macOS Intel .DMG
        uses: actions/download-artifact@v4
        with:
          name: Spoonbill_AI_Studio_macOS_Intel_x64
          path: all_releases

      - name: Download macOS ARM64 .DMG
        uses: actions/download-artifact@v4
        with:
          name: Spoonbill_AI_Studio_macOS_AppleSilicon_ARM64
          path: all_releases

      - name: Package Universal Portable Source ZIP
        run: |
          cd App
          zip -r ../all_releases/Spoonbill_AI_Studio_Universal_Source.zip . -x "__pycache__/*" "runs/*" "*.tmp"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all_releases/Spoonbill_AI_Studio_Windows_x64.zip
            all_releases/Spoonbill_AI_Studio_macOS_Intel_x64.dmg
            all_releases/Spoonbill_AI_Studio_macOS_AppleSilicon_ARM64.dmg
            all_releases/Spoonbill_AI_Studio_Universal_Source.zip
          name: Spoonbill AI Studio Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
