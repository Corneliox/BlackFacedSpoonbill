name: Build & Package Spoonbill AI Studio

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'App/requirements_lean.txt'

      - name: Install Lean Dependencies
        run: |
          cd App
          python -m pip install --upgrade pip
          pip install -r requirements_lean.txt pywebview

      - name: Verify ONNX Inference Engine
        run: |
          cd App
          python -c "from engine_onnx import SpoonbillOnnxEngine; print('Engine validated successfully!')"

      - name: Create Portable Release Package
        run: |
          mkdir -p release_dist
          cd App
          zip -r ../release_dist/Spoonbill_AI_Studio_Universal_v3.0.zip . -x "__pycache__/*" "runs/*" "*.tmp"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spoonbill_AI_Studio_Universal_Package
          path: release_dist/Spoonbill_AI_Studio_Universal_v3.0.zip

  create-github-release:
    needs: validate-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Spoonbill_AI_Studio_Universal_Package
          path: release_dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/Spoonbill_AI_Studio_Universal_v3.0.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
