name: Build & Release Spoonbill AI Studio

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS NATIVE EXECUTABLE (.EXE)
  # =========================================================================
  build-windows-exe:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd App
          python -m pip install --upgrade pip
          pip install -r requirements_lean.txt pywebview pyinstaller

      - name: Reconstruct ONNX Models
        run: |
          cd App
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11l'); print('11L Reconstructed:', e.active_model_type)"
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11n'); print('11N Reconstructed:', e.active_model_type)"

      - name: Build Executable with PyInstaller
        run: |
          cd App
          pyinstaller --noconfirm --onedir --windowed --name "Spoonbill_AI_Studio" --add-data "static;static" --add-data "models;models" desktop_app.py

      - name: Package Windows ZIP
        run: |
          mkdir release_dist
          Compress-Archive -Path "App/dist/Spoonbill_AI_Studio/*" -DestinationPath "release_dist/Spoonbill_AI_Studio_Windows_x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spoonbill_AI_Studio_Windows_x64
          path: release_dist/Spoonbill_AI_Studio_Windows_x64.zip

  # =========================================================================
  # 2. BUILD UNIVERSAL & macOS PORTABLE PACKAGE
  # =========================================================================
  build-universal-mac:
    name: Package Universal & macOS Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies & Validate
        run: |
          cd App
          python -m pip install --upgrade pip
          pip install -r requirements_lean.txt pywebview
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11l'); print('Validated:', e.active_model_type)"

      - name: Create Portable Universal Package
        run: |
          mkdir -p release_dist
          cd App
          zip -r ../release_dist/Spoonbill_AI_Studio_Universal_v3.0.zip . -x "__pycache__/*" "runs/*" "*.tmp"

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spoonbill_AI_Studio_Universal_Package
          path: release_dist/Spoonbill_AI_Studio_Universal_v3.0.zip

  # =========================================================================
  # 3. PUBLISH BOTH PACKAGES TO GITHUB RELEASES
  # =========================================================================
  publish-github-release:
    name: Publish Releases to GitHub
    needs: [build-windows-exe, build-universal-mac]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Spoonbill_AI_Studio_Windows_x64
          path: all_releases

      - name: Download Universal Artifact
        uses: actions/download-artifact@v4
        with:
          name: Spoonbill_AI_Studio_Universal_Package
          path: all_releases

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all_releases/Spoonbill_AI_Studio_Windows_x64.zip
            all_releases/Spoonbill_AI_Studio_Universal_v3.0.zip
          name: Spoonbill AI Studio Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
