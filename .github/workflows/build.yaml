name: Build and Release Spoonbill AI Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows x64 (Direct .EXE & ZIP)
          - os: macos-15-intel
            platform_name: macOS Intel x64 (.DMG)
          - os: macos-14
            platform_name: macOS Apple Silicon arm64 (.DMG)
          - os: ubuntu-latest
            platform_name: Linux x64 & Universal (Installer & ZIP)

    name: Build on ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Set up Python ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Dependencies (Windows) ───────────────────────────────────────────────
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          cd App
          python -m pip install --upgrade pip
          pip install -r requirements_lean.txt pywebview pyinstaller

      # ── Dependencies (macOS / Linux) ─────────────────────────────────────────
      - name: Install Dependencies (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd App
          python -m pip install --upgrade pip
          pip install -r requirements_lean.txt pywebview pyinstaller

      # ── Reconstruct Models ───────────────────────────────────────────────────
      - name: Reconstruct ONNX Models
        run: |
          cd App
          python -c "from engine_onnx import SpoonbillOnnxEngine; e = SpoonbillOnnxEngine('11l'); SpoonbillOnnxEngine('11n')"

      # ── Build Windows (Ready-to-run .EXE and Portable ZIP) ────────────────────
      - name: Build Windows Standalone .EXE and Portable ZIP
        if: runner.os == 'Windows'
        run: |
          cd App
          mkdir dist_release
          # 1. Build Standalone 1-File Executable (.exe ready to run)
          pyinstaller --noconfirm --onefile --windowed --name "Spoonbill_AI_Studio_v3.0.1_Windows_x64" --add-data "static;static" --add-data "models;models" desktop_app.py
          Move-Item "dist/Spoonbill_AI_Studio_v3.0.1_Windows_x64.exe" "dist_release/" -Force

          # 2. Build Onedir Folder & ZIP
          pyinstaller --noconfirm --onedir --windowed --name "Spoonbill_AI_Studio" --add-data "static;static" --add-data "models;models" desktop_app.py
          Compress-Archive -Path "dist/Spoonbill_AI_Studio/*" -DestinationPath "dist_release/Spoonbill_AI_Studio_v3.0.1_Windows_x64_Portable.zip" -Force

      # ── Build macOS Intel .DMG ───────────────────────────────────────────────
      - name: Build macOS Intel .DMG
        if: matrix.os == 'macos-15-intel'
        run: |
          cd App
          pyinstaller --noconfirm --windowed --name "Spoonbill_AI_Studio" --add-data "static:static" --add-data "models:models" desktop_app.py
          mkdir -p dist_release
          mkdir -p dmg_tmp
          cp -r dist/Spoonbill_AI_Studio.app dmg_tmp/
          ln -s /Applications dmg_tmp/Applications
          hdiutil create -volname "Spoonbill AI Studio" -srcfolder dmg_tmp -ov -format UDZO "dist_release/Spoonbill_AI_Studio_v3.0.1_macOS_Intel_x64.dmg"

      # ── Build macOS Apple Silicon .DMG ───────────────────────────────────────
      - name: Build macOS Apple Silicon .DMG
        if: matrix.os == 'macos-14'
        run: |
          cd App
          pyinstaller --noconfirm --windowed --name "Spoonbill_AI_Studio" --add-data "static:static" --add-data "models:models" desktop_app.py
          mkdir -p dist_release
          mkdir -p dmg_tmp
          cp -r dist/Spoonbill_AI_Studio.app dmg_tmp/
          ln -s /Applications dmg_tmp/Applications
          hdiutil create -volname "Spoonbill AI Studio" -srcfolder dmg_tmp -ov -format UDZO "dist_release/Spoonbill_AI_Studio_v3.0.1_macOS_AppleSilicon_ARM64.dmg"

      # ── Build Linux Installer & Universal Suite ──────────────────────────────
      - name: Build Linux Installer (.tar.gz) & Universal Portable (.zip)
        if: runner.os == 'Linux'
        run: |
          cd App
          mkdir -p dist_release
          chmod +x Install_Linux_App.sh Install_Mac_App.command
          # 1. Linux Installer Package (.tar.gz)
          tar -czvf dist_release/Spoonbill_AI_Studio_v3.0.1_Linux_x64.tar.gz --exclude="dist*" --exclude="__pycache__*" --exclude="runs*" .
          # 2. Universal Portable Package (.zip)
          zip -r dist_release/Spoonbill_AI_Studio_v3.0.1_Universal_Source.zip . -x "__pycache__/*" "runs/*" "*.tmp" "dist/*" "dist_release/*"

      # ── Publish Release Artifacts to GitHub ──────────────────────────────────
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            App/dist_release/*.exe
            App/dist_release/*.dmg
            App/dist_release/*.zip
            App/dist_release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
