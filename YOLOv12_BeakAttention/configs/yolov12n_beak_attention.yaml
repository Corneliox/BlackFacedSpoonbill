# Ultralytics YOLOv11/v12 Instance Segmentation with Beak Coordinate Attention
nc: 1 # number of classes (Black-faced spoonbill)
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # Nano
  s: [0.50, 0.50, 1024] # Small
  m: [0.50, 1.00, 512]  # Medium
  l: [1.00, 1.00, 512]  # Large

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head with Coordinate Attention injected at P3
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8 - High Resolution)

  # >>> INJECTION: Coordinate Attention on P3 for Spoonbill Spatulate Beak Focus <<<
  - [-1, 1, CoordAtt, []] # 17 (Beak-Focused Attention Output)

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 13], 1, Concat, [1]] # 19 cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16 - Medium)

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 10], 1, Concat, [1]] # 22 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32 - Large)

  - [[17, 20, 23], 1, Segment, [nc, 32, 256]] # 24 Detect/Segment(P3-BeakAttn, P4, P5)
